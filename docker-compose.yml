services:
  app:
    build: .
    container_name: labtelemetry_app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://labtelemetry:labtelemetry_dev@postgres:5432/labtelemetry
      OTEL_ENABLED: "True"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  postgres:
    # Patch fixado: `16-alpine` flutua dentro do 16.x, entao dois clones em
    # semanas diferentes rodam builds diferentes. Manter em sincronia com a
    # versao usada no servico postgres do CI (.github/workflows/ci.yml).
    image: postgres:16.14-alpine
    container_name: labtelemetry_postgres
    environment:
      POSTGRES_DB: labtelemetry
      POSTGRES_USER: labtelemetry
      POSTGRES_PASSWORD: labtelemetry_dev
    ports:
      # Publicado so para inspecao externa; o app fala pela rede do compose.
      # Sobrescreva POSTGRES_PORT se ja houver um Postgres local na 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  jaeger:
    # Jaeger v2 (construido sobre o OpenTelemetry Collector). Substitui o
    # `all-in-one` do v1, que esta em fim de vida. Versao fixa pelo mesmo
    # motivo das dependencias Python.
    #
    # Sem `COLLECTOR_OTLP_ENABLED`: em v2 os receptores OTLP (4317/4318) vem
    # ligados por padrao; a variavel era exigencia do v1 e aqui nao tem efeito.
    # A API de query segue em 16686 com as mesmas rotas (/api/services,
    # /api/traces), entao nada muda para quem consome.
    image: jaegertracing/jaeger:2.20.0
    container_name: labtelemetry_jaeger
    ports:
      # Sobrescreva se ja houver um collector OTLP local ocupando 4317/4318.
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

volumes:
  pgdata:

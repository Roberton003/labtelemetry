name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Versao fixada em requirements-dev.txt: regra de lint nao muda
        # sozinha entre dois commits identicos.
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Run ruff
        run: ruff check labtelemetry/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: labtelemetry
          POSTGRES_USER: labtelemetry
          POSTGRES_PASSWORD: labtelemetry
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://labtelemetry:labtelemetry@localhost:5432/labtelemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check
        working-directory: ./labtelemetry

      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
        working-directory: ./labtelemetry

      # Gate de correcao: a suite inteira, incluindo os testes de integracao
      # que sobem um servidor OPC-UA real.
      - name: Run tests
        run: python manage.py test telemetry -v 2
        working-directory: ./labtelemetry

      # Gate de cobertura: roda da raiz para o coverage achar o pyproject.toml.
      # Exclui os testes de integracao — sob o tracer do coverage o startup do
      # servidor OPC-UA passa de ~2s para ~56s (medido). Eles ja foram
      # exercitados no passo acima; aqui o que interessa e a medicao.
      - name: Coverage gate
        run: |
          coverage run labtelemetry/manage.py test telemetry --exclude-tag=integration
          coverage report

      # Informativo: o projeto e um lab local, DEBUG=True por padrao.
      # Expoe o delta ate um deploy real sem travar o CI.
      - name: Deployment checklist (informational)
        continue-on-error: true
        run: python manage.py check --deploy
        working-directory: ./labtelemetry
        env:
          DEBUG: "False"

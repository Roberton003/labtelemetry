services:
  jaeger:
    # Mesma versao fixada em docker-compose.yml — manter os dois em sincronia.
    # Em v2 os receptores OTLP ja vem ligados; `COLLECTOR_OTLP_ENABLED` era
    # exigencia do v1 e foi removida.
    image: jaegertracing/jaeger:2.20.0
    container_name: local_observability_jaeger
    ports:
      # Jaeger UI (Interface Web para visualizar os traces)
      - "16686:16686"
      # OpenTelemetry gRPC Receiver
      - "4317:4317"
      # OpenTelemetry HTTP Receiver
      - "4318:4318"
      # Jaeger Compact Thrift Receiver (legado; ainda ativo por padrao no v2)
      - "6831:6831/udp"
    restart: unless-stopped
